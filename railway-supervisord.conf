[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
logfile_maxbytes=0
logfile_backups=0
pidfile=/run/supervisord.pid

[program:flaresolverr]
command=/usr/local/bin/python -u /app/flaresolverr.py
directory=/app
user=flaresolverr
environment=LOG_LEVEL="info",LOG_HTML="0",PORT="8191",HOME="/app"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:mediaflow]
command=/usr/local/bin/mediaflow-proxy-light
directory=/app
environment=CONFIG_PATH="/app/mediaflow-config.toml",RUST_LOG="info",HOST="0.0.0.0",PORT="8889"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:aetheria]
command=/app/railway-aetheria.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
